[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "starloom-eink"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pillow>=11"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
starloom_eink = ["fonts/*"]
