services:
  starloom:
    image: ghcr.io/jamesread/starloom:1.10.0
    environment:
      STARAPP_SECURE_COOKIES: "false"
    ports:
      - "18080:8080"
  renderer:
    image: starloom-eink:e2e
    build: ..
    environment:
      STARLOOM_URL: http://starloom:8080
      STARLOOM_API_KEY: unused
    ports:
      - "18081:8080"
