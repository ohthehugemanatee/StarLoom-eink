[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "starloom-eink"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "pillow>=11", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: needs the e2e/compose.yaml stack"]

[tool.setuptools.package-data]
starloom_eink = ["fonts/*"]
